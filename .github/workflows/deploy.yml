name: Deploy Portfolio API

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::565962259190:role/github-actions-deploy
          aws-region: eu-north-1

      - name: Deploy through SSM
        shell: bash
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0cffac28cb51d2e9b \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/portfolio-api",
              "sudo git fetch origin main",
              "sudo git reset --hard origin/main",
              "sudo npm install --production",
              "sudo systemctl restart portfolio-api",
              "sleep 3",
              "sudo systemctl is-active --quiet portfolio-api",
              "curl --fail --silent --show-error http://127.0.0.1:3000/api/health",
              "echo API health check passed"
            ]' \
            --region eu-north-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0cffac28cb51d2e9b \
            --region eu-north-1

          echo "SSM command completed."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0cffac28cb51d2e9b \
            --region eu-north-1

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0cffac28cb51d2e9b \
            --region eu-north-1 \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            exit 1
          fi

          echo "Deployment and health check successful."