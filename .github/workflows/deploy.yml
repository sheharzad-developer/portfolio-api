name: Deploy Portfolio API

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::565962259190:role/github-actions-deploy
          aws-region: eu-north-1

      - name: Deploy through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0cffac28cb51d2e9b \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/portfolio-api",
              "sudo git fetch origin main",
              "sudo git reset --hard origin/main",
              "sudo npm install --production",
              "sudo systemctl restart portfolio-api"
            ]' \
            --region eu-north-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0cffac28cb51d2e9b

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0cffac28cb51d2e9b